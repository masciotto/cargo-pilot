<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cargo Pilot — vola, dichiara, paga (o scappa)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0b0f14;
      color: #d7dde5;
      font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    header {
      width: 100%;
      max-width: 1200px;
      padding: 14px 16px 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.14em;
      color: #ffd866;
      text-transform: uppercase;
    }
    header p { margin: 0; font-size: 12px; color: #8a93a2; }
    #term-wrap {
      width: 100%;
      max-width: 1200px;
      padding: 6px 12px 4px;
      overflow-x: auto;
      overflow-y: hidden;
    }
    #terminal {
      border: 1px solid #2a3441;
      border-radius: 8px;
      padding: 6px;
      background: #000;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
      display: inline-block;
      line-height: 1;
    }
    footer {
      width: 100%;
      max-width: 1200px;
      padding: 8px 16px 20px;
      font-size: 12px;
      color: #8a93a2;
      line-height: 1.5;
    }
    footer code { color: #ffd866; }
    #status { color: #7fd787; }
    #status.err { color: #ff7b72; }
  </style>
</head>
<body>
  <header>
    <h1>Cargo Pilot</h1>
    <p><span id="status">connessione…</span> · demo per PLAY</p>
  </header>
  <div id="term-wrap"><div id="terminal"></div></div>
  <footer>
    <div><code>←/→</code> assi · <code>↑/↓</code> prua/pitch · <code>SPAZIO</code> freni · <code>INVIO</code> menu · <code>Ctrl+C</code> esci</div>
    <div>7 voli nel mondo: Torino → Parigi → Londra → Casablanca → Dubai → Singapore → New York → Sydney.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script>
    // Dimensione FISSA: deve combaciare con il PTY del server (web/server.js).
    // Mai cambiare cols/rows dopo l'avvio: solo il font scala per stare nel viewport.
    const COLS = 160;
    const ROWS = 42;

    const statusEl = document.getElementById('status');
    const term = new Terminal({
      cols: COLS,
      rows: ROWS,
      fontSize: 11,
      fontFamily: 'ui-monospace, Menlo, Consolas, monospace',
      cursorBlink: true,
      letterSpacing: 0,
      lineHeight: 1,
      theme: {
        background: '#000000',
        foreground: '#d7dde5',
        cursor: '#ffd866',
        selectionBackground: '#3a4657',
      },
      allowProposedApi: true,
      scrollback: 0,
    });
    term.open(document.getElementById('terminal'));
    term.focus();

    function measureCell(fontSize) {
      const probe = document.createElement('canvas').getContext('2d');
      probe.font = fontSize + 'px ui-monospace, Menlo, Consolas, monospace';
      const w = probe.measureText('M').width || fontSize * 0.6;
      return { w: w, h: fontSize };
    }

    function fitFont() {
      const wrap = document.getElementById('term-wrap');
      const header = document.querySelector('header');
      const footer = document.querySelector('footer');
      const padX = 28;
      const padY = 36;
      const maxW = Math.max(320, wrap.clientWidth - padX);
      const maxH = Math.max(
        240,
        window.innerHeight - header.offsetHeight - footer.offsetHeight - padY
      );
      let best = 6;
      for (let s = 18; s >= 6; s -= 0.5) {
        const m = measureCell(s);
        if (COLS * m.w <= maxW && ROWS * m.h <= maxH) {
          best = s;
          break;
        }
      }
      if (term.options.fontSize !== best) term.options.fontSize = best;
    }

    fitFont();

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host + '/term');
    ws.onopen = () => {
      statusEl.textContent = 'connesso';
      statusEl.classList.remove('err');
      term.focus();
    };
    ws.onclose = () => {
      statusEl.textContent = 'disconnesso — ricarica la pagina';
      statusEl.classList.add('err');
    };
    ws.onerror = () => {
      statusEl.textContent = 'errore di rete';
      statusEl.classList.add('err');
    };
    ws.onmessage = (ev) => {
      term.write(typeof ev.data === 'string' ? ev.data : new Uint8Array(ev.data));
    };

    term.onData((data) => {
      if (ws.readyState === 1) ws.send(data);
    });
    term.onBinary((data) => {
      if (ws.readyState === 1) ws.send(data);
    });

    window.addEventListener('resize', fitFont);
  </script>
</body>
</html>
