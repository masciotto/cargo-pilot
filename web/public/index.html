<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cargo Pilot — vola, dichiara, paga (o scappa)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0b0f14;
      color: #d7dde5;
      font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    header {
      width: 100%;
      max-width: 960px;
      padding: 18px 16px 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.14em;
      color: #ffd866;
      text-transform: uppercase;
    }
    header p { margin: 0; font-size: 12px; color: #8a93a2; }
    #term-wrap {
      width: 100%;
      max-width: 960px;
      padding: 8px 16px 4px;
    }
    #terminal {
      border: 1px solid #2a3441;
      border-radius: 8px;
      padding: 8px;
      background: #000;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
    }
    footer {
      width: 100%;
      max-width: 960px;
      padding: 10px 16px 24px;
      font-size: 12px;
      color: #8a93a2;
      line-height: 1.6;
    }
    footer code { color: #ffd866; }
    #status { color: #7fd787; }
    #status.err { color: #ff7b72; }
  </style>
</head>
<body>
  <header>
    <h1>Cargo Pilot</h1>
    <p><span id="status">connessione…</span> · demo per PLAY</p>
  </header>
  <div id="term-wrap"><div id="terminal"></div></div>
  <footer>
    <div><code>←/→</code> assi · <code>↑/↓</code> prua/pitch · <code>SPAZIO</code> freni · <code>INVIO</code> menu · <code>Ctrl+C</code> esci</div>
    <div>7 voli nel mondo: Torino → Parigi → Londra → Casablanca → Dubai → Singapore → New York → Sydney.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const term = new Terminal({
      cols: 80,
      rows: 24,
      fontSize: 14,
      fontFamily: 'ui-monospace, Menlo, Consolas, monospace',
      cursorBlink: true,
      theme: {
        background: '#000000',
        foreground: '#d7dde5',
        cursor: '#ffd866',
        selectionBackground: '#3a4657',
      },
      allowProposedApi: true,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('terminal'));
    fit.fit();
    term.focus();

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host + '/term');
    ws.onopen = () => { statusEl.textContent = 'connesso'; statusEl.classList.remove('err'); };
    ws.onclose = () => { statusEl.textContent = 'disconnesso — ricarica la pagina'; statusEl.classList.add('err'); };
    ws.onerror = () => { statusEl.textContent = 'errore di rete'; statusEl.classList.add('err'); };
    ws.onmessage = (ev) => term.write(typeof ev.data === 'string' ? ev.data : new Uint8Array(ev.data));

    term.onData((data) => { if (ws.readyState === 1) ws.send(data); });
    term.onBinary((data) => { if (ws.readyState === 1) ws.send(data); });

    window.addEventListener('resize', () => fit.fit());
  </script>
</body>
</html>
